<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 深宇宙の背景 -->
  <rect width="512" height="512" fill="#05060F"/>

  <!-- 星々 -->
  <g fill="#C8D2EB">
    <circle cx="70" cy="300" r="2" opacity="0.7"/>
    <circle cx="120" cy="430" r="1.5" opacity="0.5"/>
    <circle cx="250" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="300" cy="430" r="2" opacity="0.7"/>
    <circle cx="430" cy="320" r="1.5" opacity="0.5"/>
    <circle cx="450" cy="440" r="2" opacity="0.6"/>
    <circle cx="110" cy="110" r="1.5" opacity="0.5"/>
    <circle cx="380" cy="110" r="1.5" opacity="0.6"/>
    <circle cx="60" cy="380" r="1.5" opacity="0.5"/>
    <circle cx="470" cy="200" r="2" opacity="0.6"/>
  </g>

  <!-- 宇宙飛行士（ヘルメット中心 256,186 / r=92） -->
  <g>
    <!-- バックパック（推進ユニット） -->
    <rect x="164" y="241" width="184" height="175" rx="16" fill="#5E76A8"/>
    <!-- 推進ノズルの発光 -->
    <circle cx="256" cy="430" r="29" fill="#FF8A3C"/>
    <!-- 脚 -->
    <rect x="199" y="385" width="51" height="106" rx="14" fill="#9FD0FF"/>
    <rect x="262" y="385" width="51" height="106" rx="14" fill="#9FD0FF"/>
    <!-- ブーツ -->
    <rect x="195" y="477" width="58" height="37" rx="8" fill="#2BE0A8"/>
    <rect x="259" y="477" width="58" height="37" rx="8" fill="#2BE0A8"/>
    <!-- 腕 -->
    <rect x="138" y="257" width="46" height="138" rx="18" fill="#E8F2FF"/>
    <rect x="328" y="257" width="46" height="138" rx="18" fill="#E8F2FF"/>
    <!-- 胴体 -->
    <rect x="178" y="252" width="156" height="147" rx="28" fill="#E8F2FF"/>
    <!-- 胸部コントロールパネル -->
    <rect x="224" y="303" width="64" height="41" rx="8" fill="#2BE0A8"/>
    <!-- ヘルメット -->
    <circle cx="256" cy="186" r="92" fill="#E8F2FF"/>
    <!-- バイザー -->
    <circle cx="256" cy="191" r="61" fill="#06324A"/>
    <!-- バイザー反射 -->
    <circle cx="232" cy="166" r="18" fill="#7DF0FF"/>
  </g>
