<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';">
  <title>ステラー・ラン</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#05060F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ステラー・ラン">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
    }
    body {
      /* 盤面外の余白フォールバック（背景キャンバス読込前/非対応時の深宇宙感） */
      background: radial-gradient(ellipse at 50% 35%, #0B1030 0%, #05060F 60%, #03040A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      overflow: hidden;
      touch-action: none;
    }
    /* 全画面の動く星空背景。盤面の背後に敷き、余白（スマホ上下・PC左右）を埋める */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }
    #game-wrapper {
      position: relative;
      z-index: 1;
      overflow: hidden;
      width: 100%;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
    }
    #gameCanvas {
      display: block;
      /* 盤面は透明クリアし背後の星空を透かす */
      background: transparent;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
